[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptlint"
version = "0.1.0"
description = "A linter for LLM prompt templates — catches the bugs that only show up in production."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mohsin Ali" }]
keywords = ["llm", "prompt", "linter", "static-analysis", "prompt-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
promptlint = "promptlint.cli:main"

[project.urls]
Homepage = "https://github.com/mohsinaliwork686-rgb/promptlint"
Issues = "https://github.com/mohsinaliwork686-rgb/promptlint/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/promptlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# promptlint linting itself
[tool.promptlint]
token_budget = 4000
